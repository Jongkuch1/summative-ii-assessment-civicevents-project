<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Service Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<main class="flex-1 max-w-5xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Service Requests</h1>
      <p class="text-sm text-gray-500 mt-1">Submit and track civic service requests</p>
    </div>
    <a href="service-request-form.html"
       class="btn-gradient px-4 py-2 rounded-xl text-sm font-semibold text-white shadow-md shadow-indigo-200">
      + New Request
    </a>
  </div>

  <!-- Status filter (admin only) -->
  <div id="filter-bar" class="hidden mb-4 flex gap-2 flex-wrap">
    <button class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white" data-status="all">All</button>
    <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:border-indigo-300" data-status="pending">Pending</button>
    <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:border-indigo-300" data-status="in_progress">In Progress</button>
    <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:border-indigo-300" data-status="resolved">Resolved</button>
    <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:border-indigo-300" data-status="closed">Closed</button>
  </div>

  <div id="sr-list" class="space-y-3"></div>
</main>

<div id="footer-container"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth(); // Role guard: must be logged in
  renderNavbar();

  if (isAdmin()) $('#filter-bar').removeClass('hidden');

  const statusColors = {
    pending:     'bg-amber-100 text-amber-700',
    in_progress: 'bg-blue-100 text-blue-700',
    resolved:    'bg-emerald-100 text-emerald-700',
    closed:      'bg-slate-100 text-slate-600',
  };
  const statusLabel = {
    pending: 'Pending', in_progress: 'In Progress', resolved: 'Resolved', closed: 'Closed',
  };
  const categoryIcons = {
    general: '', infrastructure: '', sanitation: '', safety: '',
    utilities: '', parks: '', transport: '', other: '',
  };

  let allItems = [];
  let currentFilter = 'all';

  function renderList(items) {
    if (!items.length) {
      $('#sr-list').html('<p class="text-gray-400 text-center py-12">No service requests found.</p>');
      return;
    }
    $('#sr-list').html(items.map(r => `
      <article class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 flex flex-col sm:flex-row sm:items-center gap-4 hover:shadow-md transition">
        <div class="text-xs font-semibold text-slate-500 shrink-0 uppercase">${r.category}</div>
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <h2 class="font-semibold text-slate-800 truncate">${r.title}</h2>
            <span class="text-xs px-2 py-0.5 rounded-full font-medium ${statusColors[r.status] || 'bg-slate-100 text-slate-600'}">${statusLabel[r.status] || r.status}</span>
          </div>
          <p class="text-xs text-slate-400">${r.category} · ${isAdmin() ? (r.user?.full_name || '') + ' · ' : ''}${formatDateShort(r.created_at)}</p>
        </div>
        <a href="service-request-detail.html?id=${r.id}" class="shrink-0 text-xs text-indigo-600 font-semibold hover:underline">View →</a>
      </article>`).join(''));
  }

  function applyFilter(status) {
    currentFilter = status;
    const filtered = status === 'all' ? allItems : allItems.filter(r => r.status === status);
    renderList(filtered);
    $('.filter-btn').removeClass('bg-indigo-600 text-white').addClass('bg-white border border-slate-200 text-slate-600');
    $(`.filter-btn[data-status="${status}"]`).removeClass('bg-white border border-slate-200 text-slate-600').addClass('bg-indigo-600 text-white');
  }

  function srStore() {
    try { return JSON.parse(localStorage.getItem('civic_service_requests') || '[]'); } catch(e) { return []; }
  }

  function loadRequests() {
    $('#sr-list').html(skeletonList(3));
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    setTimeout(() => {
      let items = srStore();
      // Regular users only see their own requests
      if (!isAdmin()) items = items.filter(r => r.user_id === user.id);
      allItems = items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      applyFilter(currentFilter);
    }, 300);
  }

  $(document).on('click', '.filter-btn', function() {
    applyFilter($(this).data('status'));
  });

  loadRequests();
  renderFooter();
</script>
</body>
</html>
