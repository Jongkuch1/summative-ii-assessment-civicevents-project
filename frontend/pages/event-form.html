<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Event Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<main class="flex-1 max-w-2xl mx-auto px-4 py-8">
  <a href="events.html" class="text-blue-600 text-sm hover:underline mb-4 inline-block">← Back to Events</a>
  <div class="bg-white rounded-xl shadow p-6">
    <h1 id="form-title" class="text-xl font-bold text-gray-800 mb-6">Create Event</h1>
    <form id="event-form" enctype="multipart/form-data" novalidate class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="title">Title *</label>
        <input id="title" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="description">Description</label>
        <textarea id="description" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="location">Location</label>
        <input id="location" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="starts_at">Starts At *</label>
          <input id="starts_at" type="datetime-local" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="ends_at">Ends At *</label>
          <input id="ends_at" type="datetime-local" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input id="published" type="checkbox" class="accent-blue-600 w-4 h-4"/>
        <label for="published" class="text-sm text-gray-700">Published (visible to users)</label>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="image">Event Image</label>
        <input id="image" type="file" accept="image/*" aria-label="Upload event image"
          class="block w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
        <p class="text-xs text-gray-400 mt-1">Max 5MB. JPG, PNG, WebP.</p>
        <div id="image-preview" class="mt-3 hidden">
          <img id="preview-img" src="" alt="Preview" class="h-40 rounded-lg object-cover border"/>
        </div>
      </div>
      <div id="form-error" class="hidden text-red-600 text-sm bg-red-50 p-2 rounded-lg"></div>
      <div class="flex gap-3">
        <button type="submit" id="submit-btn" class="bg-blue-700 text-white px-6 py-2.5 rounded-lg hover:bg-blue-800 transition text-sm font-medium">Save Event</button>
        <a href="events.html" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-lg hover:bg-gray-200 transition text-sm font-medium">Cancel</a>
      </div>
    </form>
  </div>
</main>

<div id="footer-container"></div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth();
  requireAdmin(); // Role guard: admin only
  renderNavbar();

  const eventId = new URLSearchParams(location.search).get('id');
  if (eventId) {
    $('#form-title').text('Edit Event');
    apiRequest('GET', `/events/${eventId}`).then(data => {
      const e = data.data || data;
      $('#title').val(e.title);
      $('#description').val(e.description);
      $('#location').val(e.location);
      if (e.starts_at) $('#starts_at').val(e.starts_at.slice(0, 16));
      if (e.ends_at) $('#ends_at').val(e.ends_at.slice(0, 16));
      $('#published').prop('checked', e.published);
      if (e.metadata?.image_url) {
        $('#preview-img').attr('src', `${BASE_URL}${e.metadata.image_url}`);
        $('#image-preview').removeClass('hidden');
      }
    }).catch(err => showToast(err.message, 'error'));
  }

  // Image preview before upload
  $('#image').on('change', function() {
    const file = this.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('Image must be under 5MB.', 'error'); this.value = ''; return; }
    if (!file.type.startsWith('image/')) { showToast('Please select an image file.', 'error'); this.value = ''; return; }
    const reader = new FileReader();
    reader.onload = e => { $('#preview-img').attr('src', e.target.result); $('#image-preview').removeClass('hidden'); };
    reader.readAsDataURL(file);
  });

  $('#event-form').on('submit', function(e) {
    e.preventDefault();
    const title = $('#title').val().trim();
    const starts_at = $('#starts_at').val();
    const ends_at = $('#ends_at').val();
    if (!title || !starts_at || !ends_at) {
      $('#form-error').text('Title, start and end dates are required.').removeClass('hidden');
      return;
    }
    $('#form-error').addClass('hidden');
    $('#submit-btn').prop('disabled', true).text('Saving…');

    const fd = new FormData();
    fd.append('title', title);
    fd.append('description', $('#description').val());
    fd.append('location', $('#location').val());
    fd.append('starts_at', starts_at);
    fd.append('ends_at', ends_at);
    fd.append('published', $('#published').is(':checked'));
    const imgFile = $('#image')[0].files[0];
    if (imgFile) fd.append('image', imgFile);

    const method = eventId ? 'PUT' : 'POST';
    const endpoint = eventId ? `/events/${eventId}` : '/events';

    apiRequest(method, endpoint, fd, true)
      .then(() => {
        showToast(eventId ? 'Event updated!' : 'Event created!');
        setTimeout(() => window.location.href = 'events.html', 1000);
      })
      .catch(err => {
        $('#form-error').text(err.message || 'Failed to save event.').removeClass('hidden');
        $('#submit-btn').prop('disabled', false).text('Save Event');
      });
  });
  renderFooter();
</script>
</body>
</html>
