<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<main class="flex-1 max-w-7xl mx-auto px-4 py-8">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">City Events</h1>
      <p id="results-count" class="text-sm text-gray-500 mt-0.5" aria-live="polite" aria-atomic="true"></p>
    </div>
    <div class="flex flex-wrap gap-3 items-center">
      <input id="filter-search" type="search" placeholder="Search events…" aria-label="Search events"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-48"/>
      <input id="filter-date" type="date" aria-label="Filter by date"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      <input id="filter-location" type="text" placeholder="Location…" aria-label="Filter by location"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-36"/>
      <button id="apply-filters" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800 transition">Filter</button>
      <button id="clear-filters" class="text-gray-500 text-sm hover:text-gray-700 underline">Clear</button>
      <!-- Admin: create event — role guard applied in JS -->
      <a id="create-event-btn" href="event-form.html" class="hidden bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 transition">+ New Event</a>
    </div>
  </div>

  <div id="events-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- skeleton placeholder -->
  </div>

  <!-- Pagination -->
  <div id="pagination" class="flex justify-center gap-2 mt-8"></div>
</main>

<div id="footer-container"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth();
  showSplash();
  renderNavbar();
  // Role guard: only admins see create button
  if (isAdmin()) $('#create-event-btn').removeClass('hidden');

  let allEvents = [];
  let currentPage = 1;
  const perPage = 9;

  const urlParams = new URLSearchParams(location.search);
  if (urlParams.get('search')) $('#filter-search').val(urlParams.get('search'));

  function loadEvents() {
    $('#events-grid').html(skeletonCard(6));
    apiRequest('GET', '/events').then(data => {
      allEvents = (data.data || data || []).filter(e => isAdmin() || e.published);
      hideSplash();
      applyFilters();
    }).catch(err => {
      hideSplash();
      $('#events-grid').html(`<p class="text-red-500 col-span-3">${err.message || 'Failed to load events.'} <button onclick="loadEvents()" class="underline text-blue-600">Retry</button></p>`);
    });
  }

  function applyFilters() {
    const search = $('#filter-search').val().toLowerCase();
    const date = $('#filter-date').val();
    const loc = $('#filter-location').val().toLowerCase();
    let filtered = allEvents.filter(e => {
      const matchSearch = !search || e.title.toLowerCase().includes(search) || (e.description || '').toLowerCase().includes(search);
      const matchDate = !date || e.starts_at?.startsWith(date);
      const matchLoc = !loc || (e.location || '').toLowerCase().includes(loc);
      return matchSearch && matchDate && matchLoc;
    });
    currentPage = 1;
    renderPage(filtered);
  }

  function renderPage(events) {
    const total = events.length;
    const pages = Math.ceil(total / perPage);
    const slice = events.slice((currentPage - 1) * perPage, currentPage * perPage);

    if (!slice.length) {
      $('#events-grid').html('<p class="text-gray-400 col-span-3 text-center py-12">No events found.</p>');
      $('#pagination').empty();
      $('#results-count').text('');
      return;
    }
    $('#results-count').text(`Showing ${(currentPage - 1) * perPage + 1}–${Math.min(currentPage * perPage, total)} of ${total} event${total !== 1 ? 's' : ''}`);

    const html = slice.map((e, i) => {
      const img = e.metadata?.image_url
        ? `<img src="${BASE_URL}${e.metadata.image_url}" alt="${e.title}" class="w-full h-40 object-cover" loading="lazy"/>`
        : `<div class="w-full h-40 bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-indigo-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10v11M20 10v11M8 14v3m4-3v3m4-3v3"/></svg></div>`;
      const badge = e.published ? '' : '<span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full ml-2">Draft</span>';
      return `
      <article class="civic-card civic-card-enter bg-white rounded-xl shadow overflow-hidden flex flex-col" style="animation-delay:${i * 50}ms">
        ${img}
        <div class="p-4 flex flex-col flex-1">
          <h2 class="font-bold text-gray-800 text-base mb-1">${e.title}${badge}</h2>
          <p class="text-xs text-gray-500 mb-1">${formatDate(e.starts_at)}</p>
          <p class="text-xs text-gray-500 mb-2">${e.location || 'TBD'}</p>
          <p class="text-sm text-gray-600 line-clamp-2 flex-1">${e.description || ''}</p>
          <div class="flex gap-2 mt-3 flex-wrap">
            <a href="event-detail.html?id=${e.id}" class="bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-blue-800 transition">View</a>
            ${!isAdmin() ? `<button class="register-btn bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-green-700 transition" data-id="${e.id}">Register</button>` : ''}
            ${isAdmin() ? `<a href="event-form.html?id=${e.id}" class="bg-yellow-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-yellow-600 transition">Edit</a>
            <button class="delete-event bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-red-600 transition" data-id="${e.id}">Delete</button>` : ''}
          </div>
        </div>
      </article>`;
    }).join('');
    $('#events-grid').html(html);

    let pag = '';
    for (let i = 1; i <= pages; i++) {
      pag += `<button class="page-btn px-3 py-1.5 rounded-lg text-sm border ${i === currentPage ? 'bg-blue-700 text-white border-blue-700' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}" data-page="${i}" aria-label="Go to page ${i}" ${i === currentPage ? 'aria-current="page"' : ''}>${i}</button>`;
    }
    $('#pagination').html(pag);

    // Register for event (user role guard)
    $('.register-btn').on('click', function() {
      const event_id = $(this).data('id');
      const $btn = $(this).prop('disabled', true).text('Registering…');
      apiRequest('POST', '/event-registrations/register', { event_id })
        .then(() => { showToast('Registered successfully!'); $btn.text('Registered').removeClass('bg-green-600 hover:bg-green-700').addClass('bg-gray-400'); })
        .catch(err => { showToast(err.message || 'Registration failed.', 'error'); $btn.prop('disabled', false).text('Register'); });
    });

    // Delete event (admin role guard)
    $('.delete-event').on('click', function() {
      const id = $(this).data('id');
      confirmModal('Delete this event?').then(confirmed => {
        if (!confirmed) return;
        apiRequest('DELETE', `/events/${id}`).then(() => {
          showToast('Event deleted.');
          loadEvents();
        }).catch(err => showToast(err.message, 'error'));
      });
    });
  }

  $(document).on('click', '.page-btn', function() {
    currentPage = parseInt($(this).data('page'));
    applyFilters();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('#apply-filters').on('click', applyFilters);
  $('#clear-filters').on('click', function() {
    $('#filter-search, #filter-date, #filter-location').val('');
    applyFilters();
  });
  $('#filter-search').on('keyup', function(e) { if (e.key === 'Enter') applyFilters(); });

  loadEvents();
  renderFooter();
</script>
</body>
</html>
