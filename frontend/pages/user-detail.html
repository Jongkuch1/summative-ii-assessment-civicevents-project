<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – User Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<main class="max-w-xl mx-auto px-4 py-8">
  <a href="users.html" class="text-blue-600 text-sm hover:underline mb-4 inline-block">← Back to Users</a>
  <div id="user-content">
    <div class="animate-pulse space-y-4">
      <div class="h-6 bg-gray-200 rounded w-1/2"></div>
      <div class="h-4 bg-gray-200 rounded w-2/3"></div>
    </div>
  </div>
</main>

<div id="footer-container"></div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth();
  requireAdmin(); // Role guard: admin only
  renderNavbar();

  const uid = new URLSearchParams(location.search).get('id');
  if (!uid) window.location.href = 'users.html';

  apiRequest('GET', `/users/${uid}`).then(data => {
    const u = data.data || data;
    $('#user-content').html(`
      <div class="bg-white rounded-xl shadow p-6">
        <div class="flex items-center gap-4 mb-6">
          <div class="w-14 h-14 rounded-full bg-blue-600 flex items-center justify-center text-white text-2xl font-bold" aria-hidden="true">${u.full_name[0].toUpperCase()}</div>
          <div>
            <h1 class="text-xl font-bold text-gray-800">${u.full_name}</h1>
            <p class="text-sm text-gray-500">${u.email}</p>
          </div>
        </div>
        <dl class="space-y-3 text-sm">
          <div class="flex justify-between"><dt class="text-gray-500">Role</dt><dd><span class="px-2 py-0.5 rounded-full text-xs font-medium ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">${u.role}</span></dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Status</dt><dd><span class="px-2 py-0.5 rounded-full text-xs font-medium ${u.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${u.is_active ? 'Active' : 'Disabled'}</span></dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Joined</dt><dd class="text-gray-700">${formatDateShort(u.created_at)}</dd></div>
        </dl>
        <div class="mt-6 flex gap-3">
          <button id="toggle-btn" class="px-4 py-2 rounded-lg text-sm font-medium ${u.is_active ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-green-100 text-green-600 hover:bg-green-200'}">
            ${u.is_active ? 'Disable User' : 'Enable User'}
          </button>
        </div>
        <p class="text-xs text-gray-400 mt-3">Note: Role changes are not permitted via the UI.</p>
      </div>`);

    $('#toggle-btn').on('click', function() {
      const endpoint = u.is_active ? `/users/${uid}/disable` : `/users/${uid}/enable`;
      const label = u.is_active ? 'Disabling…' : 'Enabling…';
      $(this).prop('disabled', true).attr('aria-busy', 'true').html(`<span class="inline-block w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin mr-1" aria-hidden="true"></span>${label}`);
      apiRequest('PATCH', endpoint).then(() => { showToast('User status updated.'); location.reload(); }).catch(err => {
        showToast(err.message, 'error');
        $(this).prop('disabled', false).attr('aria-busy', 'false').text(u.is_active ? 'Disable User' : 'Enable User');
      });
    });
  }).catch(err => {
    $('#user-content').html(`<p class="text-red-500">${err.message}</p>`);
  });
  renderFooter();
</script>
</body>
</html>
