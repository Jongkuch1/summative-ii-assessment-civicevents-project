<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Service Request</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<main class="flex-1 max-w-2xl mx-auto px-4 py-8">
  <a href="service-requests.html" class="text-indigo-600 text-sm hover:underline mb-5 inline-block">← Back to Requests</a>
  <div id="sr-content">
    <div class="animate-pulse space-y-4">
      <div class="h-6 bg-gray-200 rounded w-2/3"></div>
      <div class="h-4 bg-gray-200 rounded w-1/3"></div>
      <div class="h-24 bg-gray-200 rounded"></div>
    </div>
  </div>
</main>

<div id="footer-container"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth(); // Role guard: must be logged in
  renderNavbar();

  const id = new URLSearchParams(location.search).get('id');
  if (!id) window.location.href = 'service-requests.html';

  const statusColors = {
    pending:     'bg-amber-100 text-amber-700',
    in_progress: 'bg-blue-100 text-blue-700',
    resolved:    'bg-emerald-100 text-emerald-700',
    closed:      'bg-slate-100 text-slate-600',
  };
  const statusLabel = { pending: 'Pending', in_progress: 'In Progress', resolved: 'Resolved', closed: 'Closed' };
  const categoryIcons = {
    general: '', infrastructure: '', sanitation: '', safety: '',
    utilities: '', parks: '', transport: '', other: '',
  };

  function srStore() {
    try { return JSON.parse(localStorage.getItem('civic_service_requests') || '[]'); } catch(e) { return []; }
  }

  const requests = srStore();
  const r = requests.find(x => String(x.id) === String(id));

  Promise.resolve(r ? { data: r } : Promise.reject(new Error('Request not found.'))).then(data => {
    const r = data.data || data;

    // Role guard: admin gets status update UI; owner sees read-only detail
    const adminControls = isAdmin() ? `
      <div class="mt-6 pt-5 border-t border-slate-100">
        <h3 class="text-sm font-bold text-slate-700 mb-2">Update Status</h3>
        <div class="flex gap-2 flex-wrap">
          ${['pending','in_progress','resolved','closed'].map(s => `
            <button class="status-btn text-xs px-3 py-1.5 rounded-lg font-semibold border transition
              ${r.status === s ? statusColors[s] + ' ring-2 ring-offset-1 ring-indigo-400' : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300'}"
              data-status="${s}">${statusLabel[s]}</button>`).join('')}
        </div>
        <button id="delete-btn" class="mt-4 text-xs text-rose-600 hover:underline">Delete Request</button>
      </div>` : '';

    $('#sr-content').html(`
      <div class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
        <div class="h-1 bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500"></div>
        <div class="p-7">
          <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="text-xs font-semibold text-slate-500 uppercase">${r.category}</span>
                <h1 class="text-xl font-extrabold text-slate-900">${r.title}</h1>
              </div>
              <p class="text-xs text-slate-400">Category: <span class="font-medium text-slate-600">${r.category}</span> · Submitted ${formatDate(r.created_at)}</p>
              ${isAdmin() ? `<p class="text-xs text-slate-400 mt-0.5">By: <span class="font-medium text-slate-600">${r.user?.full_name || '—'}</span> (${r.user?.email || ''})</p>` : ''}
            </div>
            <span class="text-sm px-3 py-1 rounded-full font-semibold ${statusColors[r.status] || 'bg-slate-100 text-slate-600'}">${statusLabel[r.status] || r.status}</span>
          </div>
          ${r.description ? `<div class="bg-slate-50 rounded-xl p-4 text-sm text-slate-700 leading-relaxed">${r.description}</div>` : '<p class="text-slate-400 text-sm italic">No description provided.</p>'}
          ${adminControls}
        </div>
      </div>`);

    // Admin: status update
    $(document).on('click', '.status-btn', function() {
      const status = $(this).data('status');
      $(this).prop('disabled', true);
      try {
        const all = JSON.parse(localStorage.getItem('civic_service_requests') || '[]');
        const idx = all.findIndex(x => String(x.id) === String(id));
        if (idx !== -1) { all[idx].status = status; localStorage.setItem('civic_service_requests', JSON.stringify(all)); }
        showToast('Status updated!');
        location.reload();
      } catch(e) { showToast('Failed to update.', 'error'); $(this).prop('disabled', false); }
    });

    // Admin: delete
    $('#delete-btn').on('click', function() {
      confirmModal('Delete this service request?').then(confirmed => {
        if (!confirmed) return;
        try {
          const all = JSON.parse(localStorage.getItem('civic_service_requests') || '[]');
          localStorage.setItem('civic_service_requests', JSON.stringify(all.filter(x => String(x.id) !== String(id))));
          showToast('Deleted.');
          setTimeout(() => window.location.href = 'service-requests.html', 1000);
        } catch(e) { showToast('Failed to delete.', 'error'); }
      });
    });
  }).catch(err => {
    $('#sr-content').html(`<p class="text-rose-500">${err.message || 'Failed to load.'}</p>`);
  });

  renderFooter();
</script>
</body>
</html>
