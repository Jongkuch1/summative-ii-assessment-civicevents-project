<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-sky-50 flex items-center justify-center p-4">

<!-- Decorative blobs -->
<div class="fixed top-0 right-0 w-96 h-96 bg-gradient-to-br from-indigo-200/30 to-violet-200/20 rounded-full blur-3xl pointer-events-none -translate-y-1/2 translate-x-1/3" aria-hidden="true"></div>
<div class="fixed bottom-0 left-0 w-80 h-80 bg-gradient-to-tr from-sky-200/30 to-indigo-100/20 rounded-full blur-3xl pointer-events-none translate-y-1/2 -translate-x-1/3" aria-hidden="true"></div>

<div class="relative w-full max-w-md">
  <!-- Card -->
  <div class="bg-white rounded-3xl shadow-2xl shadow-indigo-100/60 border border-slate-100 overflow-hidden">
    <!-- Top accent bar -->
    <div class="h-1 bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500"></div>

    <div class="p-8">
      <!-- Logo + heading -->
      <div class="text-center mb-8">
        <a href="../index.html" class="inline-flex items-center justify-center gap-2.5 mb-4 group">
          <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center shadow-md shadow-indigo-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10v11M20 10v11M8 14v3m4-3v3m4-3v3"/>
            </svg>
          </div>
          <span class="text-xl font-extrabold text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">CivicEvents</span>
        </a>
        <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Welcome back</h1>
        <p class="text-slate-400 text-sm">Sign in to your account to continue</p>
      </div>

      <div id="success-msg" class="hidden bg-emerald-50 text-emerald-700 text-sm p-3 rounded-xl mb-5 border border-emerald-100 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        <span></span>
      </div>

      <form id="login-form" novalidate class="space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide" for="email">Email Address</label>
          <input id="email" type="email" required placeholder="jane@example.com"
            class="w-full border border-slate-200 bg-slate-50 hover:border-indigo-300 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-3 focus:ring-indigo-100"/>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide" for="password">Password</label>
          <div class="relative">
            <input id="password" type="password" required placeholder="••••••••"
              class="w-full border border-slate-200 bg-slate-50 hover:border-indigo-300 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-3 pr-12 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-3 focus:ring-indigo-100"/>
            <button type="button" id="toggle-pw" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 text-xs font-semibold transition">Show</button>
          </div>
        </div>

        <!-- Remember me -->
        <div class="flex items-center gap-2">
          <input id="remember" type="checkbox" class="w-4 h-4 rounded accent-indigo-600"/>
          <label for="remember" class="text-sm text-slate-600">Remember me</label>
        </div>

        <!-- Error -->
        <div id="form-error" class="hidden bg-rose-50 text-rose-600 text-sm p-3 rounded-xl border border-rose-100 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <span></span>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn"
          class="btn-gradient w-full py-3.5 rounded-xl font-bold text-sm text-white shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
          Sign In
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </button>
      </form>

      <div class="mt-6 text-center space-y-2">
        <p class="text-sm text-slate-500">
          Don't have an account?
          <a href="signup.html" class="text-indigo-600 hover:text-indigo-800 font-semibold hover:underline ml-1">Create one free</a>
        </p>
        <p class="text-xs text-slate-400">
          <a href="../index.html" class="hover:text-slate-600 transition">← Back to home</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (getToken()) window.location.href = 'events.html';

  const params = new URLSearchParams(location.search);
  if (params.get('registered')) {
    $('#success-msg span').text('Account created! Please login.');
    $('#success-msg').removeClass('hidden');
  }

  $('#toggle-pw').on('click', function() {
    const pw = $('#password');
    const isText = pw.attr('type') === 'text';
    pw.attr('type', isText ? 'password' : 'text');
    $(this).text(isText ? 'Show' : 'Hide');
  });

  $('#login-form').on('submit', function(e) {
    e.preventDefault();
    const email    = $('#email').val().trim();
    const password = $('#password').val();
    const persistent = $('#remember').is(':checked');
    if (!email || !password) return showError('Email and password are required.');

    $('#submit-btn').prop('disabled', true).html('Signing in… <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>');

    apiRequest('POST', '/auth/login', { email, password })
      .then(data => {
        const token = data.token || data.data?.token;
        const user  = data.user  || data.data?.user;
        saveAuth(token, user, persistent);
        showToast('Welcome back, ' + user.full_name + '!');
        setTimeout(() => {
          window.location.href = user.role === 'admin' ? 'dashboard.html' : 'events.html';
        }, 800);
      })
      .catch(err => {
        showError(err.message || 'Invalid credentials.');
        $('#submit-btn').prop('disabled', false).html('Sign In <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>');
      });
  });

  function showError(msg) {
    $('#form-error span').text(msg);
    $('#form-error').removeClass('hidden');
  }
</script>
</body>
</html>
