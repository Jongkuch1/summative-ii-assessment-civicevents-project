<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents - Notification Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<main class="flex-1 max-w-3xl mx-auto px-4 py-8">
  <a href="events.html" class="text-indigo-600 text-sm hover:underline mb-5 inline-block">&larr; Back</a>
  <section id="notif-content" class="bg-white rounded-xl shadow p-6" aria-live="polite">
    <div class="animate-pulse space-y-3">
      <div class="h-6 bg-gray-200 rounded w-1/2"></div>
      <div class="h-4 bg-gray-200 rounded w-1/3"></div>
      <div class="h-20 bg-gray-200 rounded w-full"></div>
    </div>
  </section>
</main>

<div id="footer-container"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth();
  renderNavbar();

  const id = new URLSearchParams(location.search).get('id');
  if (!id) window.location.href = 'events.html';

  function findRelatedLink(n) {
    if (n.metadata && n.metadata.event_id) {
      return `<a href="event-detail.html?id=${n.metadata.event_id}" class="text-indigo-600 hover:underline text-sm font-medium">Open related event</a>`;
    }
    return '<p class="text-xs text-slate-400">No linked resource for this notification.</p>';
  }

  withRetry(() => apiRequest('GET', '/notifications'), 1, 450)
    .then(data => {
      const items = data.data || data || [];
      const n = items.find(x => String(x.id) === String(id));

      if (!n) {
        $('#notif-content').html('<p class="text-rose-600 text-sm">Notification not found or no longer available.</p>');
        return;
      }

      if (!n.is_read) {
        apiRequest('PATCH', `/notifications/${n.id}`, { is_read: true }).catch(() => {});
      }

      const typeColor = {
        info: 'bg-blue-100 text-blue-700',
        success: 'bg-green-100 text-green-700',
        warning: 'bg-amber-100 text-amber-700',
        error: 'bg-rose-100 text-rose-700'
      };

      $('#notif-content').html(`
        <header class="flex items-start justify-between gap-3 mb-5">
          <div>
            <h1 class="text-xl font-bold text-slate-800">${n.title}</h1>
            <p class="text-xs text-slate-400 mt-1">${formatDate(n.created_at)}</p>
          </div>
          <span class="text-xs px-2 py-1 rounded-full font-semibold ${typeColor[n.type] || typeColor.info}">${n.type || 'info'}</span>
        </header>

        <article class="bg-slate-50 border border-slate-100 rounded-xl p-4 text-sm text-slate-700 leading-relaxed mb-5">
          ${n.message}
        </article>

        <div class="flex flex-wrap items-center gap-3">
          ${findRelatedLink(n)}
          ${isAdmin() ? `<button id="delete-notif" class="text-sm text-rose-600 hover:underline">Delete notification</button>` : ''}
        </div>
      `);

      $('#delete-notif').on('click', function() {
        confirmModal('Delete this notification?').then(confirmed => {
          if (!confirmed) return;
          apiRequest('DELETE', `/notifications/${n.id}`)
            .then(() => {
              showToast('Notification deleted');
              setTimeout(() => window.location.href = 'events.html', 700);
            })
            .catch(err => showToast(err.message || 'Delete failed.', 'error'));
        });
      });
    })
    .catch(err => {
      $('#notif-content').html(`
        <p class="text-rose-600 text-sm mb-3">${err.message || 'Failed to load notification.'}</p>
        <button id="retry-btn" class="text-indigo-600 text-sm hover:underline">Retry</button>
      `);
      $('#retry-btn').on('click', () => location.reload());
    });

  renderFooter();
</script>
</body>
</html>
