<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-sky-50 flex items-center justify-center p-4">

<!-- Decorative blobs -->
<div class="fixed top-0 right-0 w-96 h-96 bg-gradient-to-br from-violet-200/30 to-indigo-200/20 rounded-full blur-3xl pointer-events-none -translate-y-1/2 translate-x-1/3" aria-hidden="true"></div>
<div class="fixed bottom-0 left-0 w-80 h-80 bg-gradient-to-tr from-sky-200/30 to-indigo-100/20 rounded-full blur-3xl pointer-events-none translate-y-1/2 -translate-x-1/3" aria-hidden="true"></div>

<div class="relative w-full max-w-md">
  <div class="bg-white rounded-3xl shadow-2xl shadow-indigo-100/60 border border-slate-100 overflow-hidden">
    <!-- Top accent bar -->
    <div class="h-1 bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500"></div>

    <div class="p-8">
      <!-- Logo + heading -->
      <div class="text-center mb-8">
        <a href="../index.html" class="inline-flex items-center justify-center gap-2.5 mb-4 group">
          <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center shadow-md shadow-indigo-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10v11M20 10v11M8 14v3m4-3v3m4-3v3"/>
            </svg>
          </div>
          <span class="text-xl font-extrabold text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">CivicEvents</span>
        </a>
        <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Create your account</h1>
        <p class="text-slate-400 text-sm">Free forever — no payment required</p>
      </div>

      <form id="signup-form" novalidate class="space-y-4">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide" for="full_name">Full Name</label>
          <input id="full_name" type="text" required placeholder="Jane Doe"
            class="w-full border border-slate-200 bg-slate-50 hover:border-indigo-300 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-3 focus:ring-indigo-100"/>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide" for="email">Email Address</label>
          <input id="email" type="email" required placeholder="jane@example.com"
            class="w-full border border-slate-200 bg-slate-50 hover:border-indigo-300 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-3 focus:ring-indigo-100"/>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide" for="password">Password</label>
          <div class="relative">
            <input id="password" type="password" required placeholder="••••••••"
              class="w-full border border-slate-200 bg-slate-50 hover:border-indigo-300 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-3 pr-12 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-3 focus:ring-indigo-100"/>
            <button type="button" id="toggle-pw" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 text-xs font-semibold transition">Show</button>
          </div>
          <!-- Strength bar -->
          <div id="strength-bar" class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div id="strength-fill" class="h-full rounded-full w-0 transition-all duration-300"></div>
          </div>
          <div class="flex items-center justify-between mt-1">
            <p id="strength-label" class="text-xs text-slate-400"></p>
            <p class="text-xs text-slate-300">Min 8 chars, A–Z, a–z, 0–9, symbol</p>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide" for="confirm_password">Confirm Password</label>
          <input id="confirm_password" type="password" required placeholder="••••••••"
            class="w-full border border-slate-200 bg-slate-50 hover:border-indigo-300 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-3 focus:ring-indigo-100"/>
        </div>

        <!-- Error -->
        <div id="form-error" class="hidden bg-rose-50 text-rose-600 text-sm p-3 rounded-xl border border-rose-100 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <span></span>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn"
          class="btn-gradient w-full py-3.5 rounded-xl font-bold text-sm text-white shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 mt-2">
          Create Account
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </button>
      </form>

      <div class="mt-6 text-center space-y-2">
        <p class="text-sm text-slate-500">
          Already have an account?
          <a href="login.html" class="text-indigo-600 hover:text-indigo-800 font-semibold hover:underline ml-1">Sign in</a>
        </p>
        <p class="text-xs text-slate-400">
          <a href="../index.html" class="hover:text-slate-600 transition">← Back to home</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (getToken()) window.location.href = 'events.html';

  $('#toggle-pw').on('click', function() {
    const pw = $('#password');
    const isText = pw.attr('type') === 'text';
    pw.attr('type', isText ? 'password' : 'text');
    $(this).text(isText ? 'Show' : 'Hide');
  });

  function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 8)          score++;
    if (/[A-Z]/.test(pw))        score++;
    if (/[a-z]/.test(pw))        score++;
    if (/[0-9]/.test(pw))        score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    return score;
  }

  $('#password').on('input', function() {
    const val = $(this).val();
    const score = checkStrength(val);
    const pct = (score / 5) * 100;
    const colors = ['bg-rose-400','bg-rose-400','bg-amber-400','bg-yellow-400','bg-emerald-500'];
    const labels = ['Very weak','Weak','Fair','Good','Strong'];
    const labelColors = ['text-rose-500','text-rose-500','text-amber-500','text-yellow-600','text-emerald-600'];
    $('#strength-fill')
      .css('width', pct + '%')
      .removeClass('bg-rose-400 bg-amber-400 bg-yellow-400 bg-emerald-500')
      .addClass(colors[score - 1] || 'bg-rose-400');
    $('#strength-label')
      .text(val ? labels[score - 1] || '' : '')
      .removeClass('text-rose-500 text-amber-500 text-yellow-600 text-emerald-600')
      .addClass(val ? labelColors[score - 1] || '' : '');
  });

  function validatePassword(pw) {
    return pw.length >= 8 && /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
  }

  $('#signup-form').on('submit', function(e) {
    e.preventDefault();
    const full_name = $('#full_name').val().trim();
    const email     = $('#email').val().trim();
    const password  = $('#password').val();
    const confirm   = $('#confirm_password').val();

    if (!full_name || !email || !password || !confirm) return showError('All fields are required.');
    if (!validatePassword(password)) return showError('Password must be at least 8 characters with uppercase, lowercase, number, and special character.');
    if (password !== confirm)        return showError('Passwords do not match.');

    $('#submit-btn').prop('disabled', true).html('Creating account… <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>');

    apiRequest('POST', '/auth/signup', { full_name, email, password })
      .then(() => {
        showToast('Account created! Please login.', 'success');
        setTimeout(() => window.location.href = 'login.html?registered=1', 1500);
      })
      .catch(err => {
        showError(err.message || 'Signup failed.');
        $('#submit-btn').prop('disabled', false).html('Create Account <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>');
      });
  });

  function showError(msg) {
    $('#form-error span').text(msg);
    $('#form-error').removeClass('hidden');
  }
</script>
</body>
</html>
