<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Promos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<main class="flex-1 max-w-7xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Promos</h1>
    <!-- Admin only create button -->
    <a id="create-promo-btn" href="promo-form.html" class="hidden bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 transition">+ New Promo</a>
  </div>
  <div id="promos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<div id="footer-container"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth();
  renderNavbar();
  if (isAdmin()) $('#create-promo-btn').removeClass('hidden'); // Role guard

  function loadPromos() {
    $('#promos-grid').html(skeletonCard(6));
    apiRequest('GET', '/promos').then(data => {
      const items = (data.data || data || []).filter(p => isAdmin() || p.published);
      if (!items.length) { $('#promos-grid').html('<p class="text-gray-400 col-span-3 text-center py-12">No promos available.</p>'); return; }
      const html = items.map(p => `
        <article class="bg-white rounded-xl shadow hover:shadow-md transition overflow-hidden flex flex-col">
          <div class="relative bg-slate-800 h-44 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            ${!p.published ? '<span class="absolute top-2 left-2 bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full">Draft</span>' : ''}
          </div>
          <div class="p-4 flex flex-col flex-1">
            <h2 class="font-bold text-gray-800 mb-1">${p.title}</h2>
            <p class="text-sm text-gray-600 line-clamp-2 flex-1">${p.description || ''}</p>
            <div class="flex gap-2 mt-3 flex-wrap">
              <a href="promo-detail.html?id=${p.id}" class="bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-blue-800 transition">▶ Play</a>
              ${isAdmin() ? `<a href="promo-form.html?id=${p.id}" class="bg-yellow-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-yellow-600 transition">Edit</a>
              <button class="delete-promo bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-red-600 transition" data-id="${p.id}">Delete</button>` : ''}
            </div>
          </div>
        </article>`).join('');
      $('#promos-grid').html(html);

      $('.delete-promo').on('click', function() {
        const id = $(this).data('id');
        confirmModal('Delete this promo?').then(confirmed => {
          if (!confirmed) return;
          apiRequest('DELETE', `/promos/${id}`).then(() => { showToast('Deleted.'); loadPromos(); }).catch(err => showToast(err.message, 'error'));
        });
      });
    }).catch(err => {
      $('#promos-grid').html(`<p class="text-red-500 col-span-3">${err.message} <button onclick="loadPromos()" class="underline text-blue-600">Retry</button></p>`);
    });
  }

  loadPromos();
  renderFooter();
</script>
</body>
</html>
