<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<div class="flex flex-1 max-w-7xl w-full mx-auto px-4 py-8 gap-6">
  <!-- Admin Sidebar -->
  <aside class="w-52 shrink-0 hidden md:block" aria-label="Admin sidebar">
    <nav class="bg-white rounded-xl shadow p-4 space-y-1 text-sm font-medium sticky top-4">
      <a href="dashboard.html"        class="flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-600 text-white">Dashboard</a>
      <a href="events.html"           class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Events</a>
      <a href="announcements.html"    class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Announcements</a>
      <a href="promos.html"           class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Promos</a>
      <a href="service-requests.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Service Requests</a>
      <a href="users.html"            class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Users</a>
      <a href="notification-form.html"class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Broadcast</a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 min-w-0">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Admin Dashboard</h1>

    <!-- Stats grid -->
    <div id="stats-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">
      <!-- skeleton cards -->
    </div>

    <!-- Charts row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-bold text-gray-700 text-sm mb-4">Content Overview</h2>
        <canvas id="bar-chart" height="200" aria-label="Bar chart showing events, promos, users and registrations"></canvas>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-bold text-gray-700 text-sm mb-4">Content Breakdown</h2>
        <div class="flex items-center justify-center h-48">
          <canvas id="doughnut-chart" aria-label="Doughnut chart showing service request statuses"></canvas>
        </div>
      </div>
    </div>

    <!-- Activity feed -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="font-bold text-gray-800 mb-4">Recent Activity</h2>
      <div id="activity-feed" class="space-y-3 text-sm text-gray-600" aria-live="polite" aria-label="Recent activity feed">
        <div class="flex items-start gap-3 border-b pb-3 animate-pulse"><div class="w-8 h-8 bg-gray-200 rounded-full shrink-0"></div><div class="flex-1 space-y-2"><div class="h-4 bg-gray-200 rounded w-2/3"></div><div class="h-3 bg-gray-200 rounded w-1/3"></div></div></div>
        <div class="flex items-start gap-3 border-b pb-3 animate-pulse"><div class="w-8 h-8 bg-gray-200 rounded-full shrink-0"></div><div class="flex-1 space-y-2"><div class="h-4 bg-gray-200 rounded w-3/4"></div><div class="h-3 bg-gray-200 rounded w-1/4"></div></div></div>
        <div class="flex items-start gap-3 border-b pb-3 animate-pulse"><div class="w-8 h-8 bg-gray-200 rounded-full shrink-0"></div><div class="flex-1 space-y-2"><div class="h-4 bg-gray-200 rounded w-1/2"></div><div class="h-3 bg-gray-200 rounded w-2/5"></div></div></div>
        <div class="flex items-start gap-3 animate-pulse"><div class="w-8 h-8 bg-gray-200 rounded-full shrink-0"></div><div class="flex-1 space-y-2"><div class="h-4 bg-gray-200 rounded w-2/3"></div><div class="h-3 bg-gray-200 rounded w-1/3"></div></div></div>
      </div>
    </div>
  </main>
</div>

<div id="footer-container"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth();
  requireAdmin(); // Role guard: admin only
  renderNavbar();

  function statCard(label, value, icon, color) {
    return `<div class="bg-white rounded-xl shadow p-5 flex items-center gap-4">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-xl shrink-0 ${color || 'bg-indigo-50'}" aria-hidden="true">${icon}</div>
      <div>
        <p class="text-2xl font-bold text-gray-800">${value ?? '—'}</p>
        <p class="text-xs text-gray-500 mt-0.5">${label}</p>
      </div>
    </div>`;
  }

  // Skeleton
  $('#stats-grid').html(Array(9).fill(`<div class="animate-pulse bg-white rounded-xl p-5 h-24"></div>`).join(''));

  let barChart, doughnutChart;

  apiRequest('GET', '/dashboard/admin').then(data => {
    const s = data.data || data;
    // Backend returns nested objects — map them to flat values
    const totalEvents         = parseInt(s.events?.total_events         || s.total_events         || 0);
    const totalPromos         = parseInt(s.promos?.total_promos         || s.total_promos         || 0);
    const totalUsers          = parseInt(s.users?.total_users           || s.users_count          || 0);
    const totalRegistrations  = parseInt(s.registrations?.total_registrations || s.registrations_count || 0);
    const totalAnnouncements  = parseInt(s.announcements?.total_announcements || 0);
    const totalFeedback       = parseInt(s.feedbacks?.total_feedback    || 0);
    const totalNotifications  = parseInt(s.notifications?.total_notifications || s.unread_notifications || 0);
    const activeUsers         = parseInt(s.users?.active_users          || 0);
    const upcomingEvents      = parseInt(s.events?.upcoming_events      || 0);

    const ic = (paths, cls) => `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">${paths}</svg>`;
    const cards = [
      statCard('Total Events',      totalEvents,        ic('<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>','text-indigo-600'), 'bg-indigo-50'),
      statCard('Total Promos',      totalPromos,        ic('<path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>','text-violet-600'), 'bg-violet-50'),
      statCard('Total Users',       totalUsers,         ic('<path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>','text-sky-600'), 'bg-sky-50'),
      statCard('Registrations',     totalRegistrations, ic('<path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>','text-emerald-600'), 'bg-emerald-50'),
      statCard('Announcements',     totalAnnouncements, ic('<path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>','text-amber-600'), 'bg-amber-50'),
      statCard('Total Feedback',    totalFeedback,      ic('<path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>','text-orange-600'), 'bg-orange-50'),
      statCard('Active Users',      activeUsers,        ic('<path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>','text-cyan-600'), 'bg-cyan-50'),
      statCard('Upcoming Events',   upcomingEvents,     ic('<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>','text-green-600'), 'bg-green-50'),
      statCard('Notifications',     totalNotifications, ic('<path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>','text-rose-600'), 'bg-rose-50'),
    ];
    $('#stats-grid').html(cards.join(''));

    // Bar chart — content overview
    const barCtx = document.getElementById('bar-chart');
    if (barChart) barChart.destroy();
    barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['Events', 'Promos', 'Users', 'Registrations'],
        datasets: [{
          label: 'Count',
          data: [totalEvents, totalPromos, totalUsers, totalRegistrations],
          backgroundColor: ['#6366f1','#7c3aed','#0ea5e9','#10b981'],
          borderRadius: 6,
          borderSkipped: false,
        }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: '#f1f5f9' } },
          x: { grid: { display: false } },
        },
      },
    });

    // Doughnut chart — content breakdown
    const dCtx = document.getElementById('doughnut-chart');
    if (doughnutChart) doughnutChart.destroy();
    const pending    = totalAnnouncements;
    const inProgress = totalPromos;
    const resolved   = totalRegistrations;
    const closed     = totalFeedback;
    doughnutChart = new Chart(dCtx, {
      type: 'doughnut',
      data: {
        labels: ['Announcements', 'Promos', 'Registrations', 'Feedback'],
        datasets: [{
          data: [pending, inProgress, resolved, closed],
          backgroundColor: ['#fbbf24','#60a5fa','#34d399','#94a3b8'],
          borderWidth: 2,
          borderColor: '#ffffff',
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } },
        },
        cutout: '65%',
      },
    });
  }).catch(err => {
    $('#stats-grid').html(`<p class="text-red-500 col-span-4" role="alert">${err.message || 'Failed to load stats.'} <button onclick="location.reload()" class="underline text-blue-600 ml-1">Retry</button></p>`);
  });

  // Build activity feed from real API endpoints
  Promise.allSettled([
    apiRequest('GET', '/events'),
    apiRequest('GET', '/announcements'),
    apiRequest('GET', '/promos'),
    apiRequest('GET', '/notifications'),
  ]).then(([evRes, anRes, prRes, notifRes]) => {
    const rawEvents = evRes.value?.data?.events || evRes.value?.data || evRes.value || [];
    const rawAnn    = anRes.value?.data || anRes.value || [];
    const rawPromos = prRes.value?.data || prRes.value || [];
    const rawNotifs = notifRes.value?.data || notifRes.value || [];
    const events        = rawEvents.slice(0, 3).map(e => ({ label: 'New event published', title: e.title, created_at: e.created_at, type: 'event' }));
    const announcements = rawAnn.slice(0, 3).map(a => ({ label: 'Announcement posted', title: a.title, created_at: a.created_at, type: 'announcement' }));
    const promos        = rawPromos.slice(0, 2).map(p => ({ label: 'Promo created', title: p.title, created_at: p.created_at, type: 'promo' }));
    const notifs        = rawNotifs.slice(0, 2).map(n => ({ label: 'Notification sent', title: n.title, created_at: n.created_at, type: 'notification' }));
    const items = [...events, ...announcements, ...promos, ...notifs].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 8);

    if (!items.length) {
      $('#activity-feed').html('<p class="text-gray-400 text-center py-4">No recent activity.</p>');
      return;
    }
    const iconMap = {
      event:        { bg: 'bg-indigo-100', svg: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' },
      promo:        { bg: 'bg-violet-100', svg: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>' },
      announcement: { bg: 'bg-sky-100',    svg: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>' },
      notification: { bg: 'bg-rose-100',   svg: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>' },
    };
    const html = items.map(a => {
      const ic = iconMap[a.type] || { bg: 'bg-gray-100', svg: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' };
      return `
      <div class="flex items-start gap-3 border-b pb-3 last:border-0">
        <div class="w-8 h-8 rounded-full ${ic.bg} flex items-center justify-center shrink-0" aria-hidden="true">${ic.svg}</div>
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">${a.label}</p>
          <p class="font-medium text-gray-800">${a.title}</p>
          <p class="text-xs text-gray-400">${formatDate(a.created_at)}</p>
        </div>
      </div>`;
    }).join('');
    $('#activity-feed').html(html);
  });

  renderFooter();
</script>
</body>
</html>
