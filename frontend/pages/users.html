<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicEvents – Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="navbar-container"></div>

<div class="flex flex-1 max-w-7xl w-full mx-auto px-4 py-8 gap-6">
  <!-- Admin Sidebar -->
  <aside class="w-52 shrink-0 hidden md:block" aria-label="Admin sidebar">
    <nav class="bg-white rounded-xl shadow p-4 space-y-1 text-sm font-medium sticky top-4">
      <a href="dashboard.html"         class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Dashboard</a>
      <a href="events.html"            class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Events</a>
      <a href="announcements.html"     class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Announcements</a>
      <a href="promos.html"            class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Promos</a>
      <a href="service-requests.html"  class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Service Requests</a>
      <a href="users.html"             class="flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-600 text-white">Users</a>
      <a href="notification-form.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Broadcast</a>
    </nav>
  </aside>

  <main class="flex-1 min-w-0">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">User Management</h1>
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <table class="w-full text-sm" role="table" aria-label="Users table">
        <thead class="bg-gray-50 text-gray-600 text-xs uppercase">
          <tr>
            <th class="px-4 py-3 text-left" scope="col">Name</th>
            <th class="px-4 py-3 text-left" scope="col">Email</th>
            <th class="px-4 py-3 text-left" scope="col">Role</th>
            <th class="px-4 py-3 text-left" scope="col">Status</th>
            <th class="px-4 py-3 text-left" scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody" class="divide-y divide-gray-100">
          <tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="footer-container"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireAuth();
  requireAdmin(); // Role guard: admin only
  renderNavbar();

  function loadUsers() {
    apiRequest('GET', '/users').then(data => {
      const users = data.data || data || [];
      if (!users.length) { $('#users-tbody').html('<tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">No users found.</td></tr>'); return; }
      const rows = users.map(u => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 font-medium text-gray-800">${u.full_name}</td>
          <td class="px-4 py-3 text-gray-600">${u.email}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">${u.role}</span>
          </td>
          <td class="px-4 py-3">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${u.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${u.is_active ? 'Active' : 'Disabled'}</span>
          </td>
          <td class="px-4 py-3">
            <div class="flex gap-2">
              <a href="user-detail.html?id=${u.id}" class="text-blue-600 hover:underline text-xs">View</a>
              <!-- Role change intentionally disabled per requirements -->
              <button class="toggle-user text-xs px-2 py-1 rounded ${u.is_active ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-green-100 text-green-600 hover:bg-green-200'}"
                data-id="${u.id}" data-active="${u.is_active}">
                ${u.is_active ? 'Disable' : 'Enable'}
              </button>
            </div>
          </td>
        </tr>`).join('');
      $('#users-tbody').html(rows);

      $('.toggle-user').on('click', function() {
        const uid = $(this).data('id');
        const active = $(this).data('active');
        const endpoint = active ? `/users/${uid}/disable` : `/users/${uid}/enable`;
        $(this).prop('disabled', true).text('…');
        apiRequest('PATCH', endpoint).then(() => { showToast('User status updated.'); loadUsers(); }).catch(err => { showToast(err.message, 'error'); loadUsers(); });
      });
    }).catch(err => {
      $('#users-tbody').html(`<tr><td colspan="5" class="px-4 py-6 text-center text-red-500">${err.message}</td></tr>`);
    });
  }

  loadUsers();
  renderFooter();
</script>
</body>
</html>
